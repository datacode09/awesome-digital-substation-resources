[project]
name = "dsub"
version = "0.1.0"
description = "Learn digital substation engineering (IEC 61850, protection, fault analysis) with runnable Python"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
